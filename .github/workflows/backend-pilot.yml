name: Backend pilot smoke

on:
  pull_request:
    paths:
      - 'web/backend/docker-compose.pilot.yml'
      - 'web/backend/pilot-bootstrap.sh'
      - 'web/backend/.env.pilot.example'
      - 'web/backend/Dockerfile'
      - 'web/backend/.dockerignore'
      - 'web/backend/requirements.txt'
      - 'web/backend/migrations/**'
      - '.github/workflows/backend-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral pilot env
        run: |
          python - <<'PY'
          import base64, secrets
          from pathlib import Path
          f=base64.urlsafe_b64encode
          lines=[
            "MARKETPLACE_ENVIRONMENT=development",
            "MARKETPLACE_FRONTEND_URL=http://localhost:3000",
            f"MARKETPLACE_JWT_SECRET={secrets.token_urlsafe(48)}",
            f"MARKETPLACE_MARKETPLACE_TOKEN_KEY={f(secrets.token_bytes(32)).decode()}",
            f"MARKETPLACE_MFA_ENCRYPTION_KEY={f(secrets.token_bytes(32)).decode()}",
            "MARKETPLACE_BILLING_PROVIDER=not_configured",
            "MARKETPLACE_MARKETPLACE_LIMITER_BACKEND=redis",
            "MARKETPLACE_RUN_FBO_MONITOR_IN_API=false",
            "POSTGRES_DB=trovendi_pilot",
            "POSTGRES_USER=trovendi_pilot",
            f"POSTGRES_PASSWORD={secrets.token_hex(32)}",
          ]
          Path(".env.pilot").write_text("\n".join(lines)+"\n")
          PY
      - name: Build and start
        run: sh pilot-bootstrap.sh
      - name: Check API health and readiness
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:8000/ready && exit 0; sleep 2; done
          docker compose --env-file .env.pilot -f docker-compose.pilot.yml logs
          exit 1
      - name: Check worker process
        run: |
          worker_id="$(docker compose --env-file .env.pilot -f docker-compose.pilot.yml ps -q worker)"
          test -n "$worker_id"
          docker inspect --format '{{if and .State.Running (eq .State.ExitCode 0) (eq .RestartCount 0)}}running{{end}}' "$worker_id" | grep -qx running
      - name: Cleanup
        if: always()
        run: docker compose --env-file .env.pilot -f docker-compose.pilot.yml down -v
