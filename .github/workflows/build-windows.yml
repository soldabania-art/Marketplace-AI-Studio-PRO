name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stamp build version
        shell: pwsh
        run: |
          $version = "3.6.${{ github.run_number }}"
          (Get-Content 'studio/__init__.py' -Raw) -replace "__version__='[^']+'", "__version__='$version'" | Set-Content 'studio/__init__.py' -Encoding utf8
          (Get-Content 'installer.iss' -Raw) -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`"" | Set-Content 'installer.iss' -Encoding utf8
          Write-Host "Stamped version $version"

      - name: Smoke test Python sources
        shell: pwsh
        run: |
          python -m compileall -q app.py studio tests
          python -c "import app; import studio.ui_v36; import studio.ui_v35; import studio.ui_v34; import studio.ui_v33; import studio.ui_v32; import studio.ui_v31; import studio.ai_router; import studio.review_autopilot; import studio.wb_ad_manager; import studio.sku_analytics; import studio.local_ai_manager; import studio.local_ai_setup; import studio.local_image; import studio.hardware_probe; import studio.connectors; import studio.services; import studio.safety_control; import studio.openai_billing; import studio.ai_errors; import studio.diagnostics; import studio.updater; import studio.ozon_center; print('smoke ok')"

      - name: Run core functional contract tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_contracts.py" -v

      - name: Run headless UI construction tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_ui_smoke.py" -v

      - name: Build application EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Marketplace_AI_Studio_PRO app.py
          if (!(Test-Path 'dist/Marketplace_AI_Studio_PRO.exe')) { throw 'Application EXE was not created' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if (!(Test-Path 'installer-output/Marketplace_AI_Studio_PRO_Setup.exe')) { throw 'Installer was not created' }

      - name: Upload ready installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marketplace_AI_Studio_PRO_Setup
          path: installer-output/Marketplace_AI_Studio_PRO_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.6.${{ github.run_number }}
          name: Marketplace AI Studio PRO Mega Edition 3.6 build ${{ github.run_number }}
          body: |
            Windows-сборка Marketplace AI Studio PRO Mega Edition 3.6 PROFIT CENTER.

            Добавлен новый Profit Center по каждому WB SKU: продажи, возвраты, оборот, выплата WB, точный рекламный расход SKU, ДРР, себестоимость единицы и проданных единиц, прибыль, маржа, остаток и статус. По умолчанию самые убыточные товары находятся сверху.

            Себестоимость редактируется прямо в Profit Center и хранится локально. Формула прибыли использует нормализованную выплату WB, COGS по фактически проданным единицам и рекламный расход SKU из WB fullstats; расходы не вычитаются повторно из payout.

            Сохранены Reputation Center 3.5, FREE-FIRST Local AI, guardrails, audit, точная рекламная атрибуция и защита WB API от 429.

            Тестирование: compile/import smoke, contract tests экономики SKU и headless UI construction включая Profit Center.

            Скачать Marketplace_AI_Studio_PRO_Setup.exe ниже в Assets.
          artifacts: installer-output/Marketplace_AI_Studio_PRO_Setup.exe
          artifactErrorsFailBuild: true
          makeLatest: true
          generateReleaseNotes: false
