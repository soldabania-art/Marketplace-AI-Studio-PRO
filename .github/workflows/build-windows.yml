name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Marketplace_AI_Studio_PRO app.py
          if (!(Test-Path 'dist/Marketplace_AI_Studio_PRO.exe')) { throw 'Application EXE was not created' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer.iss
          if (!(Test-Path 'installer-output/Marketplace_AI_Studio_PRO_Setup.exe')) { throw 'Installer was not created' }

      - name: Upload ready installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marketplace_AI_Studio_PRO_Setup
          path: installer-output/Marketplace_AI_Studio_PRO_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v2.1.${{ github.run_number }}
          name: Marketplace AI Studio PRO Mega Edition 2.1 build ${{ github.run_number }}
          body: |
            Windows-сборка Marketplace AI Studio PRO Mega Edition 2.1 AUTONOMOUS GROWTH.

            Добавлено: рекламный AI-автопилот с защитным лимитом изменения ставок; AI-обработка и безопасные автоответы на отзывы; снимки эффективности карточек до/после; автоматическое предложение rollback при ухудшении бизнес-метрик; сохранены AI-фабрика, визуал, SEO и WB Publish Center.

            Скачать Marketplace_AI_Studio_PRO_Setup.exe ниже в Assets.
          artifacts: installer-output/Marketplace_AI_Studio_PRO_Setup.exe
          artifactErrorsFailBuild: true
          makeLatest: true
          generateReleaseNotes: false
