name: D01 infographic acceptance capture

on:
  push:
    branches: [codex/d01-visual-reference]
    paths:
      - .github/workflows/d01-infographic-capture.yml
      - web/app/design-reference/d01.css
      - web/components/D01DesignReference.js
      - web/tests/d01-design-reference.test.mjs

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d01-visual-reference
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build preview
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Verify geometry and capture evidence
        working-directory: web
        run: |
          python -m pip install websocket-client
          HOSTNAME=127.0.0.1 npm run start -- -H 127.0.0.1 -p 3010 > /tmp/d01-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:3010/design-reference?variant=b' >/dev/null && break
            sleep 1
          done
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-allow-origins=* \
            --remote-debugging-port=9222 --user-data-dir=/tmp/d01-chrome about:blank >/tmp/d01-chrome.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done
          mkdir -p docs/design/d01/selected-b/final-acceptance
          python - <<'PY'
          import base64, json, os, time, urllib.request
          from websocket import create_connection

          output = 'docs/design/d01/selected-b/final-acceptance'
          tabs = json.load(urllib.request.urlopen('http://127.0.0.1:9222/json'))
          tab = next(item for item in tabs if item.get('type') == 'page' and not item.get('url', '').startswith('chrome-extension://'))
          ws = create_connection(tab['webSocketDebuggerUrl'])
          serial = 0

          def command(method, params=None):
              global serial
              serial += 1
              ws.send(json.dumps({'id': serial, 'method': method, 'params': params or {}}))
              while True:
                  message = json.loads(ws.recv())
                  if message.get('id') == serial:
                      assert 'error' not in message, message
                      return message.get('result', {})

          def evaluate(expression):
              return command('Runtime.evaluate', {'expression': expression, 'returnByValue': True})['result']['value']

          def wait_for(expression, message):
              for _ in range(300):
                  if evaluate(expression): return
                  time.sleep(.1)
              debug = evaluate("JSON.stringify({url:location.href,ready:document.readyState,text:document.body?.innerText?.slice(0,500),html:document.documentElement?.outerHTML?.slice(0,500)})")
              raise AssertionError(f'{message}: {debug}')

          def viewport(width, height):
              command('Emulation.setDeviceMetricsOverride', {
                  'width': width, 'height': height, 'deviceScaleFactor': 1,
                  'mobile': width <= 480, 'screenWidth': width, 'screenHeight': height,
              })

          def navigate():
              command('Page.navigate', {'url': 'http://127.0.0.1:3010/design-reference?variant=b&screen=home'})
              wait_for("document.readyState==='complete' && Boolean(document.querySelector('.platformOrbit'))", 'page missing')
              time.sleep(.4)

          def rect(selector):
              return json.loads(evaluate(f"JSON.stringify((()=>{{const r=document.querySelector('{selector}').getBoundingClientRect();return {{left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}}}})())"))

          def click(selector, label):
              point = json.loads(evaluate(f"JSON.stringify((()=>{{const n=[...document.querySelectorAll('{selector}')].find(x=>x.textContent.includes({json.dumps(label)}));if(!n)return null;n.scrollIntoView({{block:'center'}});const r=n.getBoundingClientRect();return {{x:r.left+r.width/2,y:r.top+r.height/2}}}})())"))
              assert point, label
              command('Input.dispatchMouseEvent', {'type':'mousePressed','x':point['x'],'y':point['y'],'button':'left','clickCount':1})
              command('Input.dispatchMouseEvent', {'type':'mouseReleased','x':point['x'],'y':point['y'],'button':'left','clickCount':1})

          def capture(name, selector=None, full=False):
              params = {'format':'png','fromSurface':True,'captureBeyondViewport':True}
              if selector:
                  r = rect(selector)
                  params['clip'] = {'x':r['left'],'y':r['top']+evaluate('scrollY'),'width':r['width'],'height':r['height'],'scale':1}
              elif full:
                  size = command('Page.getLayoutMetrics')['cssContentSize']
                  params['clip'] = {'x':0,'y':0,'width':size['width'],'height':size['height'],'scale':1}
              shot = command('Page.captureScreenshot', params)
              with open(os.path.join(output, name), 'wb') as f: f.write(base64.b64decode(shot['data']))

          def capture_region(name, selectors, margin=28):
              rects = [rect(selector) for selector in selectors]
              scroll_y = evaluate('scrollY')
              left = max(0, min(item['left'] for item in rects) - margin)
              top = max(0, min(item['top'] for item in rects) + scroll_y - margin)
              right = max(item['right'] for item in rects) + margin
              bottom = max(item['bottom'] for item in rects) + scroll_y + margin
              shot = command('Page.captureScreenshot', {
                  'format':'png', 'fromSurface':True, 'captureBeyondViewport':True,
                  'clip': {'x':left, 'y':top, 'width':right-left, 'height':bottom-top, 'scale':1},
              })
              with open(os.path.join(output, name), 'wb') as f: f.write(base64.b64decode(shot['data']))

          command('Page.enable'); command('Runtime.enable')
          viewport(1440, 1000); navigate()
          if evaluate("Boolean(document.querySelector('.cookieBanner'))"):
              click('.cookieActions button', 'Только обязательные')
              wait_for("!document.querySelector('.cookieBanner')", 'cookie did not close')

          s3, s4, s5 = rect('.step3'), rect('.step4'), rect('.step5')
          c34, c45 = rect('.step3 > .orbitConnector'), rect('.step4 > .orbitConnector')
          style34 = json.loads(evaluate("JSON.stringify((()=>{const s=getComputedStyle(document.querySelector('.step3 > .orbitConnector'));return {right:s.borderRightWidth,bottom:s.borderBottomWidth,background:s.backgroundColor}})())"))
          stack34 = json.loads(evaluate("JSON.stringify({step3:getComputedStyle(document.querySelector('.step3')).zIndex,step4:getComputedStyle(document.querySelector('.step4')).zIndex})"))
          assert abs(c34['top'] - s3['bottom']) <= 2, (s3, c34)
          assert abs(c34['left'] - s4['right']) <= 3, (s4, c34)
          assert c34['bottom'] > s4['top'] + 50, (s4, c34)
          assert style34['right'] == '2px' and style34['bottom'] == '2px' and style34['background'] == 'rgba(0, 0, 0, 0)', style34
          assert stack34['step3'] == '2' and stack34['step4'] == 'auto', stack34
          assert abs(c45['left'] - s5['right']) <= 10 and abs(c45['right'] - s4['left']) <= 2, (s4, s5, c45)
          capture('14-b-home-full-1440.png', full=True)
          capture('19-b-infographic-transition-1440.png', '.platformStory')
          capture_region('22-b-transition-03-04-closeup-1440.png', ['.step3', '.step4'])

          viewport(1280, 900); navigate()
          capture('20-b-infographic-transition-1280.png', '.platformStory')
          desktop1280 = [rect(f'.step{i}') for i in range(1, 6)]
          desktop1280_connectors = [rect('.step3 > .orbitConnector'), rect('.step4 > .orbitConnector')]
          assert abs(desktop1280_connectors[0]['left'] - desktop1280[3]['right']) <= 3
          assert abs(desktop1280_connectors[1]['left'] - desktop1280[4]['right']) <= 10
          assert abs(desktop1280_connectors[1]['right'] - desktop1280[3]['left']) <= 2

          viewport(390, 844); navigate()
          mobile = [rect(f'.step{i}') for i in range(1, 6)]
          assert all(mobile[i]['bottom'] < mobile[i+1]['top'] for i in range(4)), mobile
          connectors = [rect(f'.step{i} > .orbitConnector') for i in range(1, 5)]
          assert all(c['width'] <= 3 and 20 <= c['height'] <= 24 for c in connectors), connectors
          assert evaluate('Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth') <= 0
          capture('21-b-infographic-mobile-390.png', '.platformStory')

          report = {'desktop1440': {'step3':s3,'step4':s4,'step5':s5,'connector03to04':c34,'connector04to05':c45,'stacking':stack34}, 'desktop1280': {'steps':desktop1280,'connectors03to05':desktop1280_connectors}, 'mobile390':mobile, 'mobileConnectors':connectors}
          with open(os.path.join(output, 'infographic-report.json'), 'w') as f: json.dump(report, f, indent=2)
          print(json.dumps(report, indent=2))
          ws.close()
          PY
      - name: Commit updated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/docs/design/d01/selected-b/final-acceptance
          git commit -m "docs: refresh D01 infographic evidence"
          git push origin HEAD:codex/d01-visual-reference
