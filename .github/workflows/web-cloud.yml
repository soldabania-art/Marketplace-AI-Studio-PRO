name: Web Cloud

on:
  push:
    branches: [main, web-cloud]
    paths:
      - 'web/**'
      - '.github/workflows/web-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/backend
    env:
      MARKETPLACE_DATABASE_URL: sqlite:///./ci.db
      MARKETPLACE_JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend contract tests
        run: pytest -q
