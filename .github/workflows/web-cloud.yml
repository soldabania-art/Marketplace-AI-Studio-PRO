name: Web Cloud

on:
  push:
    branches: [main, web-cloud]
    paths:
      - 'web/**'
      - '.github/workflows/web-cloud.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-cloud-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
        working-directory: .
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run CSV contract tests
        run: node --test tests/*.test.mjs
      - name: Build Next.js app
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/backend
    env:
      MARKETPLACE_DATABASE_URL: sqlite:///./ci.db
      MARKETPLACE_JWT_SECRET: ci-only-secret-not-for-production
      PYTHONPATH: .
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
        working-directory: .
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend contract tests
        run: python -m pytest -q

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trovendi_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trovendi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: web/backend
    env:
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trovendi_ci
      MARKETPLACE_JWT_SECRET: ci-only-secret-not-for-production
      MARKETPLACE_REDIS_URL: redis://localhost:6379/15
      MARKETPLACE_MARKETPLACE_LIMITER_BACKEND: redis
      MARKETPLACE_MARKETPLACE_LIMITER_MAX_WAIT_SECONDS: 0.05
      PYTHONPATH: .
      PGPASSWORD: postgres
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
        working-directory: .
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Migrate empty PostgreSQL database to head
        run: |
          alembic upgrade head
          alembic current
          python -m app.verify_ctrl01_migration
      - name: Reset ephemeral migration schema
        run: |
          psql -h localhost -U postgres -d trovendi_ci -v ON_ERROR_STOP=1 -c 'DROP SCHEMA public CASCADE'
          psql -h localhost -U postgres -d trovendi_ci -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA public'
      - name: Upgrade PostgreSQL from CTRL01 predecessor to combined head
        run: |
          alembic upgrade 20260912_0028
          python -m app.verify_ctrl01_previous_upgrade seed
          alembic upgrade head
          alembic current
          python -m app.verify_ctrl01_migration
          python -m app.verify_ctrl01_previous_upgrade verify
      - name: Run integration tests on PostgreSQL
        run: python -m pytest -q

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, postgresql]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: trovendi_e2e, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d trovendi_e2e" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trovendi_e2e
      MARKETPLACE_JWT_SECRET: e2e-only-jwt-secret-not-for-production-1234567890
      MARKETPLACE_MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MARKETPLACE_REDIS_URL: redis://localhost:6379/14
      MARKETPLACE_MARKETPLACE_LIMITER_BACKEND: redis
      MARKETPLACE_API_URL: http://127.0.0.1:8000
      PYTHONPATH: web/backend
    steps:
      - uses: actions/checkout@v7
        with: { ref: ${{ env.EXPECTED_HEAD_SHA }} }
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Install isolated test dependencies
        run: |
          pip install -r web/backend/requirements.txt
          cd web && npm ci && npx playwright install --with-deps chromium
      - name: Generate non-exported test auth material
        run: |
          echo "E2E_PASSWORD=$(openssl rand -base64 36)" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import base64
          import secrets
          print('E2E_TOTP_SECRET=' + base64.b32encode(secrets.token_bytes(20)).decode().rstrip('='))
          PY
      - name: Prepare isolated PostgreSQL fixtures
        run: |
          cd web/backend && alembic upgrade head
          cd .. && python e2e/seed_acceptance.py
      - name: Run local backend and frontend browser acceptance
        run: |
          (cd web/backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../../backend-e2e.log 2>&1) &
          (cd web && npm run dev -- --hostname 127.0.0.1 --port 3000 > ../frontend-e2e.log 2>&1) &
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:3000 >/dev/null && break; sleep 1; done
          cd web && npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            web/e2e-artifacts
            web/test-results
            backend-e2e.log
            frontend-e2e.log
          if-no-files-found: warn
