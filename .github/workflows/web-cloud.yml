name: Web Cloud

on:
  push:
    branches: [web-cloud]
    paths:
      - 'web/**'
      - '.github/workflows/web-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build static web app
        run: npm run build
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marketplace_AI_Studio_Cloud
          path: web/out
          if-no-files-found: error
