name: trovendi-backend-pilot
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trovendi_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-trovendi_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.pilot}
    volumes: [pilot-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env.pilot
    environment:
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trovendi_pilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.pilot}@postgres:5432/${POSTGRES_DB:-trovendi_pilot}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: .env.pilot
    environment:
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trovendi_pilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.pilot}@postgres:5432/${POSTGRES_DB:-trovendi_pilot}
      MARKETPLACE_REDIS_URL: redis://redis:6379/0
      PORT: "8000"
    ports: ["${API_BIND:-127.0.0.1}:8000:8000"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    build: .
    env_file: .env.pilot
    environment:
      MARKETPLACE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trovendi_pilot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.pilot}@postgres:5432/${POSTGRES_DB:-trovendi_pilot}
      MARKETPLACE_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  pilot-postgres:
